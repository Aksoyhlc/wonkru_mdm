name: wonkru-mdm-image
x-wonkru-mode: http

services:
  server:
    image: "${WONKRU_IMAGE:?Set WONKRU_IMAGE to a released image}"
    pull_policy: missing
  caddy:
    ports: !override
      - "${HTTP_BIND_IP:-127.0.0.1}:${API_PORT:-8080}:8080"
      - "${HTTP_BIND_IP:-127.0.0.1}:${WEB_PORT:-8082}:8082"
