name: Tests

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.1.2'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart install serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: wonkru_mdm_server
        run: serverpod generate

      # Tests use the embedded PostgreSQL configured in config/test.yaml, so no
      # Docker services are required.
      - name: Run tests
        working-directory: wonkru_mdm_server
        run: dart test
