name: Bug report
description: Report a problem in Wonkru MDM
title: "[Bug]: "
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include secrets, tokens, or personal
        data. Security issues go to the process in SECURITY.md, not here.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server (wonkru_mdm_server)
        - Panel (wonkru_mdm_flutter)
        - Agent (wonkru_mdm_mobil)
        - Core module (wonkru_core)
        - Deployment (deploy/vps)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server, panel, or agent logs (redact secrets).
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true
