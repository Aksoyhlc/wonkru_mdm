# This is the configuration file for your production environment.
# Typically, you will want to route the traffic through a load balancer
# which adds SSL security through https. If you use Serverpod's standard
# Terraform scripts to deploy your server, all you need to change in
# this file are the `*.mdm.example.com` placeholders below.
#
# Replace example public hosts and internal database/Redis hosts before deployment.
# Set allowedOrigins to the panel HTTPS origin.
# For a private CA, distribute its certificate through provisioning or LOCAL_CA_PATH.

# Configuration for the main API server.
# Public API address used by the panel and agent.
apiServer:
  port: 8080
  publicHost: api.mdm.example.com
  publicPort: 443
  publicScheme: https

# Configuration for the Insights server.
insightsServer:
  port: 8081
  publicHost: insights.mdm.example.com
  publicPort: 443
  publicScheme: https

# Configuration for the web server.
webServer:
  port: 8082
  publicHost: app.mdm.example.com
  publicPort: 443
  publicScheme: https

# This is the database setup for your servers. The default for the Google Cloud
# Engine Terraform configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. db.internal.mdm.example.com.
database:
  host: db.internal.mdm.example.com
  port: 5432
  # Keep this name consistent with database creation and deployment settings.
  name: wonkru_mdm
  user: postgres
  requireSsl: true
  #isUnixSocket: true # defaults to false
  #maxConnectionCount: 10 # Defaults to 10, a negative or null value removes the limit

# This is the setup for Redis. The default for the Google Cloud Engine Terraform
# configuration is to connect on a private IP address.
# If you are connecting on a public IP (e.g. on AWS or Google Cloud Run), you
# connect on the public IP of the database e.g. redis.internal.mdm.example.com.
redis:
  enabled: false
  host: redis.internal.mdm.example.com
  port: 6379
  #user: # defaults to empty
  #requireSsl: true # defaults to false

# Allow transport overhead for APK uploads and Base64-encoded device uploads.
maxRequestSize: 301989888 # 288 MB - the maximum size of requests allowed in bytes

sessionLogs:
  persistentEnabled: true
  consoleEnabled: false
# consoleLogFormat: json # Defaults to "json", options are "text" or "json"

# futureCallExecutionEnabled: true # Defaults to true

#futureCall:
#  concurrencyLimit: 1 # Defaults to 1, a negative or null value removes the limit
#  scanInterval: 5000 # Unit in milliseconds, defaults to 5000

# Recommended when serving web clients: keeps auth tokens in httpOnly
# cookies. Without this, web tokens live in JavaScript-readable storage,
# where any XSS can steal them. Web clients opt in with
# `client.cookieAuth = true`. Requires `allowedOrigins`; browsers from
# origins not in the list lose cross-origin access, including to public
# endpoints.
authCookie:
  name: wonkru_auth
  sameSite: lax
  path: /
  secure: true # Send cookies over HTTPS only.

allowedOrigins:
  # Panel HTTPS origin (scheme, host, and optional port).
  - https://app.mdm.example.com
