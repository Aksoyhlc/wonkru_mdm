# Development and test services (optional).
#
# Tests do not need Docker: `config/test.yaml` uses an embedded PostgreSQL via
# `database.dataPath`. These containers are only for developers who prefer a
# TCP PostgreSQL/Redis. Passwords come from the environment and fall back to
# throwaway local-only defaults; never commit real credentials here.
services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wonkru_mdm
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_database:-postgres}
    volumes:
      - wonkru_mdm_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass ${SERVERPOD_PASSWORD_redis:-redis}
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wonkru_mdm_test
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_database:-postgres}
    volumes:
      - wonkru_mdm_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass ${SERVERPOD_PASSWORD_redis:-redis}
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  wonkru_mdm_data:
  wonkru_mdm_test_data:
